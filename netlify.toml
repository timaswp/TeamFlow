[build]
  # Build from the repository root so npm workspaces resolve correctly.
  command = "npm run build -w client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"

# React Router owns the routing, so every unknown path must serve the SPA shell
# instead of Netlify's 404 page.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
