databases:
  - name: teamflow-db
    databaseName: teamflow
    plan: free

services:
  - type: web
    name: teamflow-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build -w server
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: teamflow-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Set this to your Netlify site URL after the first deploy.
      # Multiple origins can be given as a comma-separated list.
      - key: CLIENT_URL
        sync: false
